services:
  caddy:
    image: ghcr.io/techies-lab-projects-07-codearena/codearena-caddy:dev
    container_name: caddy
    restart: unless-stopped
    ports:
      - "4000:4000"
      - "4007:4000"
    env_file: caddy/caddy.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
  dashboard:
    image: ghcr.io/techies-lab-projects-07-codearena/codearena-frontend:dev
    restart: unless-stopped
  
  apk:
    image: ghcr.io/techies-lab-projects-07-codearena/codearena-apk:dev
    restart: unless-stopped
    
  api:
    image: ghcr.io/techies-lab-projects-07-codearena/codearena-api:dev
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  caddy_data: 